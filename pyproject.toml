[project]
name = "image-edit"
version = "0.1.0"
description = "Extensible PySide6 desktop image editor foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.4",
    "ruff>=0.4",
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.16",
]

[project.scripts]
image-edit = "app.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["resources/*.png", "resources/*.ico"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["packaging"]

[tool.ruff.lint]
select = ["E", "F", "I"]
