name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lint.txt
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lint.txt
      - name: Black
        run: black --check .
      - name: Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lint.txt
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Pytest
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m compileall app scripts tests
      - name: Verify package metadata
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps .

  package-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build portable package
        shell: pwsh
        run: ./packaging/build.ps1
      - name: Build installer
        shell: pwsh
        run: ./packaging/build_installer.ps1
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-edit-windows
          path: |
            dist/ImageEdit-portable.zip
            dist/ImageEdit-Setup-*.exe
          if-no-files-found: error
